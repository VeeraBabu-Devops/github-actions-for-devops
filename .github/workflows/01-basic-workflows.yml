# ==============================================================================
# Workflow Name : Basic Workflows
# Description   : Learn GitHub Actions basic concepts
# Trigger       : Manual
# Runner        : Ubuntu Latest
# Level         : Beginner
# ==============================================================================

name: 01 - GitHub Actions Basics

on:
  workflow_dispatch:

jobs:
  basic-demo:

    name: Basic GitHub Actions Demo

    runs-on: ubuntu-latest

    steps:

      - name: Welcome Message
        run: |
          echo "====================================="
          echo "🚀 Welcome to GitHub Actions"
          echo "====================================="

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display System Information
        run: |
          echo "Operating System : $(uname -a)"
          echo "Current User     : $(whoami)"
          echo "Hostname         : $(hostname)"
          echo "Current Date     : $(date)"

      - name: Display Working Directory
        run: |
          echo "Current Directory:"
          pwd

      - name: List Repository Files
        run: |
          echo "Repository Contents"
          ls -la

      - name: Disk Usage
        run: df -h

      - name: Memory Usage
        run: free -m

      - name: Workflow Completed
        run: |
          echo "====================================="
          echo "GitHub Actions executed successfully!"
          echo "====================================="
