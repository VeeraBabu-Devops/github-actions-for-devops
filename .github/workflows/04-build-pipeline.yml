# ==============================================================================
# Workflow Name : Build Pipelines
# Description   : Java, Node.js, and Python examples
# ==============================================================================

name: "04 - 📦 Build Pipeline"

on:
  workflow_dispatch:

jobs:

  build:

    name: Build Application

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sample-node-app

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Display Node Version
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Verify Build Output
        run: ls -R dist

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: sample-node-app/dist
      - name: Build Summary
        run: |
          echo "======================================"
          echo "Build Pipeline Completed Successfully"
          echo "Application : sample-node-app"
          echo "Artifact    : node-build"
          echo "Status      : SUCCESS"
          echo "======================================"

  deploy:

    name: Deploy Simulation

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: node-build
          path: deployment

      - name: Verify Artifact
        run: |
          echo "Downloaded files:"
          ls -R deployment

      - name: Simulate Deployment
        run: |
          echo "Deploying application..."
          echo "Deployment completed successfully."
