# ==============================================================================
# Workflow Name : Build Pipelines
# Description   : Java, Node.js, and Python examples
# ==============================================================================

name: 04 - Build Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Node.js Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sample-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Display Node Version
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Verify Build Output
        run: ls -R dist

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: sample-app/dist

      - run: python --version
