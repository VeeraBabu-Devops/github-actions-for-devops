# ==============================================================================
# Workflow Name : Job Management
# Description   : Demonstrates jobs, needs, and artifacts
# ==============================================================================

name: 03 - Job Management

on:
  workflow_dispatch:

env:
  COMPANY: OpenAI Learning

jobs:

  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Application
        run: |
          echo "Building application..."
          echo "Application Name: ${{ vars.APP_NAME }}"
          echo "Environment: ${{ vars.ENVIRONMENT }}"
          sleep 3
          echo "Build completed successfully."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Security Scan
        run: |
          echo "Running security scan..."
          sleep 2
          echo "No vulnerabilities found."

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Lint Check
        run: |
          echo "Checking coding standards..."
          sleep 2
          echo "No lint issues."

  test:
    name: Test Job

    needs:
      - build
      - security-scan
      - lint

    runs-on: ubuntu-latest

    steps:
      - name: Run Tests
        run: |
          echo "Executing test cases..."
          sleep 3
          echo "All tests passed."

  deploy:
    name: Deploy Job

    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Verify Secret
        run: |
          if [ -n "${{ secrets.DEMO_SECRET }}" ]; then
            echo "Secret is configured."
          else
            echo "Secret not found."
          fi

      - name: Deploy Application
        run: |
          echo "Deploying application..."
          echo "Company: $COMPANY"
          echo "Deployment successful."
